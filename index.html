<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendation System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #343a40;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        .recommend-button {
            display: block;
            width: 250px;
            margin: 30px auto;
            padding: 14px;
            background: #007bff;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            font-size: 17px;
        }

        .recommend-button:hover {
            background: #0056b3;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        .container h2 {
            text-align: center;
            margin: 30px 0;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 25px;
        }

        .book {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .book img {
            width: 150px;
            height: 220px;
            object-fit: cover;
            border-radius: 5px;
        }

        .book h3 {
            font-size: 16px;
            margin: 15px 0 8px;
        }

        .book p {
            margin: 7px;
            font-size: 14px;
        }

        @media(max-width: 1000px) {
            .books {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media(max-width: 700px) {
            .books {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 450px) {
            .books {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Book Recommendation System</h1>
</header>

<a href="/recommend" class="recommend-button">
    Get Book Recommendations
</a>

<div class="container">

    <h2>Popular Books</h2>

    <div class="books">

        {% for i in range(book_name|length) %}

        <div class="book">

            <img src="{{ image[i] }}" alt="{{ book_name[i] }}">

            <h3>{{ book_name[i] }}</h3>

            <p><strong>Author:</strong> {{ author[i] }}</p>

            <p>⭐ {{ rating[i] }}</p>

            <p>{{ votes[i] }} ratings</p>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
