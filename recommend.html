<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Recommendations</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #343a40;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        form {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        input {
            width: 60%;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 7px 0 0 7px;
            outline: none;
        }

        button {
            padding: 15px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 0 7px 7px 0;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        h2 {
            text-align: center;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-top: 30px;
        }

        .book {
            background: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .book img {
            width: 150px;
            height: 220px;
            object-fit: cover;
            border-radius: 5px;
        }

        .book h3 {
            font-size: 16px;
            margin-top: 15px;
        }

        .back {
            display: block;
            width: 150px;
            margin: 40px auto;
            padding: 12px;
            background: #343a40;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 7px;
        }

        @media(max-width: 900px) {
            .books {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 500px) {
            .books {
                grid-template-columns: 1fr;
            }

            input {
                width: 65%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Find Similar Books</h1>
</header>

<div class="container">

    <form action="/recommend_books" method="POST">

        <input
            type="text"
            name="user_input"
            placeholder="Enter book name..."
            required
        >

        <button type="submit">
            Recommend
        </button>

    </form>

    {% if data %}

    <h2>Recommended Books</h2>

    <div class="books">

        {% for item in data %}

        <div class="book">

            <img src="{{ item[2] }}" alt="{{ item[0] }}">

            <h3>{{ item[0] }}</h3>

            <p><strong>Author:</strong> {{ item[1] }}</p>

        </div>

        {% endfor %}

    </div>

    {% endif %}

    <a href="/" class="back">
        ← Back to Home
    </a>

</div>

</body>
</html>
